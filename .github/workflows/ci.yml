name: CI

# Builds the app and runs the unit tests on every push to main and on every pull request.
on:
  push:
    branches: [main, experimental]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15      # Apple Silicon
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check the packaging scripts still parse
        run: |
          for script in build.sh release.sh setup-signing.sh setup-ci-signing.sh; do
            bash -n "$script"
          done
